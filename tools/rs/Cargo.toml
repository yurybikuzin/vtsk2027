[workspace]
resolver = "2"
members = [
    "cbr-panel",
    "cbr-fetch",
    "rosstat-fetch",
    "excel-sampler",
    "excel-split",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
calamine = "0.38"
chrono = { version = "0.4", features = ["clock"] }
clap = { version = "4", features = ["derive"] }
csv = "1"
env_logger = "0.11"
hex = "0.4"
log = "0.4"
regex = "1"
reqwest = { version = "0.13.5", features = ["blocking", "rustls", "json"], default-features = false }
rust_xlsxwriter = "0.102.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.1"
toml = "0.9"
